---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-target
  namespace: aiopscsp-e2e-argocd-aiopscsp-live-20261104-095758
  labels: &id001
    app.kubernetes.io/name: oom-target
    app.kubernetes.io/component: cache-warmer
    app.kubernetes.io/part-of: report-service
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oom-target
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: oom-target
        image: docker.io/library/node:22.23.4-bookworm-slim@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d
        imagePullPolicy: IfNotPresent
        command:
        - node
        - -e
        - "\"use strict\";\nconsole.log(\"Report cache warm-up started\");\nconst\
          \ blocks = [];\nconst targetBlocks = 8;\nfunction allocate() {\n  const\
          \ block = Buffer.alloc(8 * 1024 * 1024);\n  for (let offset = 0; offset\
          \ < block.length; offset += 4096) {\n    block[offset] = 165;\n  }\n  blocks.push(block);\n\
          \  if (blocks.length < targetBlocks) {\n    setTimeout(allocate, 250);\n\
          \  } else {\n    console.log(\"Report cache loaded\");\n    setInterval(()\
          \ => {\n      if (blocks.length !== targetBlocks || blocks.some(value =>\
          \ value[0] !== 165)) {\n        process.exitCode = 1;\n      }\n    }, 1000);\n\
          \  }\n}\nsetTimeout(allocate, 120000);\n"
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      nodeSelector:
        kubernetes.io/hostname: customisation-aiops-sftriage-k0rdent-wrk-2
