---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: oom-demo
  name: oom-demo
  namespace: aiopscsp-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oom-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oom-demo
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - node
        - -e
        - "\"use strict\";\nconsole.log(\"Bounded memory fixture started\");\nconst\
          \ blocks = [];\nconst targetBlocks = 8;\nfunction allocate() {\n  const\
          \ block = Buffer.alloc(8 * 1024 * 1024);\n  for (let offset = 0; offset\
          \ < block.length; offset += 4096) {\n    block[offset] = 165;\n  }\n  blocks.push(block);\n\
          \  if (blocks.length < targetBlocks) {\n    setTimeout(allocate, 250);\n\
          \  } else {\n    console.log(\"Bounded memory fixture allocation complete\"\
          );\n    setInterval(() => {\n      if (blocks.length !== targetBlocks ||\
          \ blocks.some(value => value[0] !== 165)) {\n        process.exitCode =\
          \ 1;\n      }\n    }, 1000);\n  }\n}\nsetTimeout(allocate, 120000);\n"
        image: docker.io/library/node:22.23.4-bookworm-slim@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d
        imagePullPolicy: IfNotPresent
        name: oom-demo
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      enableServiceLinks: false
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 5
